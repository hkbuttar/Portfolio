- Azure TTS
overview: |-
  A voice-to-voice agentic product discovery assistant combining a LangGraph agent, MCP tool integration, faster-whisper transcription, and Azure TTS with a React/FastAPI frontend. This repository currently covers the data ingestion and retrieval layer; the conversational agent and voice pipeline are still in progress.
approach:
- |-
  Built a Kaggle-sourced ingestion pipeline (download &rarr; schema inspection &rarr; cleaning &rarr; embedding &rarr; indexing) turning the Amazon Product Dataset 2020 into a persistent Chroma vector index for a downstream <code>rag.search</code> MCP tool.
- |-
  Diagnosed and documented real data-quality issues in the source data &mdash; entirely empty brand and ingredient fields, no ratings column, and roughly 4% malformed price strings &mdash; building a <code>$</code>-anchored price parser and stripping recurring product-description boilerplate rather than silently ingesting noisy data.
- |-
  Embedded product text (title, features, ingredients) locally with all-MiniLM-L6-v2 and indexed 708 products under a category slice with filterable metadata for downstream agent queries.
- |-
  Scoped the retriever's public interface (<code>RagRetriever.search</code>) as a thin, swappable contract so the MCP layer, LangGraph agent, and voice pipeline can be built out independently on top of it.
