{% macro doc_card(link) %}
{%- if link.doc_ext == "pdf" -%}
<a class="doc-card" href="{{ link.href }}" target="_blank" rel="noopener" onclick="return handleDocClick(event, '{{ link.href }}', 'pdf', '{{ link.label }}')">
  <div class="doc-thumb"><iframe src="{{ link.href }}#toolbar=0&amp;navpanes=0&amp;view=FitH" tabindex="-1" aria-hidden="true"></iframe></div>
  <div class="doc-meta"><span class="doc-label">{{ link.label }}</span><span class="doc-badge">{{ link.doc_badge }}</span></div>
</a>
{%- else -%}
<a class="doc-card" href="{{ link.href }}" target="_blank" rel="noopener">
  <div class="doc-thumb doc-thumb-pptx"><span class="doc-glyph"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect x="3" y="4" width="18" height="13" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
<path d="M7 20h10M12 17v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
<path d="M7 8h6M7 11h10M7 14h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
</svg></span></div>
  <div class="doc-meta"><span class="doc-label">{{ link.label }}</span><span class="doc-badge">{{ link.doc_badge }}</span></div>
</a>
{%- endif -%}
{% endmacro %}
