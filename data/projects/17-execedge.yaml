short: |-
  Optimal execution algorithm backtester &mdash; TWAP, VWAP, Almgren-Chriss, and an RL policy, benchmarked with bootstrap confidence intervals entirely on real order book data from Binance, Coinbase, and Kraken, no synthetic data anywhere.
