title: Retail Demand Forecasting & PEFT Benchmarking
org: Rakuten Advertising · Capstone
dates: Jan 2026 &ndash; Aug 2026
team: with Kevin Fan, Aren Mizuno, Kai Schindler
short: |-
  A capstone with Rakuten Advertising benchmarking time-series foundation models against PEFT fine-tuning for affiliate-revenue forecasting &mdash; zero-shot Chronos won every vertical, cutting forecast error 42%.
stack:
- Python
- FastAPI
- Vite
