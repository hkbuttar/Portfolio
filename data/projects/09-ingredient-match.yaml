slug: ingredient-match
tag: PROJECT 09
title: Ingredient Match
org: Independent Project
dates: 2025 &ndash; 2026
team: Solo
short: |-
  A Streamlit app recommending Sephora and Ulta beauty products by exact ingredient overlap, ranked with a Jaccard-similarity tiebreak.
stack:
- Python
- Streamlit
- Selenium
- rapidfuzz
overview: |-
  A cross-retailer beauty product recommender that matches products by their actual ingredient lists rather than category or brand alone &mdash; given any product, it surfaces the most ingredient-similar alternatives across Sephora and Ulta.
approach:
- |-
  Built resumable Selenium scrapers (<code>undetected-chromedriver</code>) for Sephora and Ulta that crawl every brand page, extract ingredients from each product's embedded <code>__NEXT_DATA__</code> JSON with DOM/regex fallbacks, and save incrementally so a run can be safely interrupted and resumed.
- |-
  Cleaned both raw datasets &mdash; dropping products with missing ingredients, fixing malformed line terminators and unquoted ingredient cells, and stripping marketing blurbs and shade-name prefixes from ingredient text.
- |-
  Combined and deduplicated the two retailers into one dataset: normalized 261 raw category names down to ~55 canonical categories, then used rapidfuzz token-sort matching on brand + product name to identify cross-retailer duplicates.
- |-
  Built the ranking logic itself &mdash; exact ingredient-set overlap as the primary score, Jaccard similarity as a tiebreak (to avoid rewarding products that merely have very long ingredient lists), and rating as a secondary tiebreak &mdash; surfaced through an interactive Streamlit dashboard.
