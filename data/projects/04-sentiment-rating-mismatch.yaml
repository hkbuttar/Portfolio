slug: sentiment-rating-mismatch
tag: PROJECT 04
title: Amazon Reviews &mdash; Sentiment&ndash;Rating Mismatch Detection
org: Big Data and Cloud Computing · Final Project
dates: Sep 2025 &ndash; Dec 2025
team: with Minhae Park, Minhao Zhang, Ali Mardan, Zach Laurence
short: |-
  A distributed PySpark pipeline on 115GB of Amazon review data (compressed to 40GB in Parquet) that flags reviews where positive text hides a low star rating &mdash; 25&ndash;30% of reviews show this mismatch.
stack:
- PySpark
- GCP Dataproc
- GCS
- TF-IDF
- Word2Vec
- ALS
overview: |-
  Star ratings alone miss nuanced customer experience: a review can read positively while carrying a low rating, or vice versa, and those mismatches are exactly the signal that surfaces hidden product or service problems. This project builds a two-pipeline system on Amazon's full review dataset (Electronics, Books, Clothing, and Arts & Crafts categories) to detect and explain sentiment&ndash;rating mismatches at scale.
approach:
- |-
  Built a PySpark ingestion pipeline moving 115GB of raw review and metadata JSON from Hugging Face into GCS, with a custom schema for inconsistent fields, deduplication, and a windowed 10-year review / 5-year modeling slice, cutting storage to 40GB in Parquet and load time from 60+ minutes to under 5.
- |-
  Used weak labeling (star rating as a proxy) with TF-IDF + logistic regression to score review sentiment fast and interpretably at scale, then flagged mismatches &mdash; positive text paired with a low rating, or the reverse &mdash; as the core signal of interest; found that 25&ndash;30% of reviews show this mismatch.
- |-
  Layered Word2Vec embeddings, K-Means clustering, and LSH-based approximate nearest-neighbor search to explain *why* a mismatch occurred by surfacing semantically similar reviews, then used LDA topic modeling to extract human-readable themes (shipping, quality, fit, durability) from the mismatched-review population.
- |-
  After full 5-class rating prediction underperformed (42.5% accuracy) due to heavy class imbalance and mismatched reviews, pivoted to a binary ALS collaborative-filtering "Like vs. Not Like" formulation &mdash; reported honestly as a deliberate scope change rather than concealing the weaker result &mdash; reaching 93.8% precision and 0.782 F1, prioritizing precision so recommendations stay "safe bets" even at the cost of recall.
